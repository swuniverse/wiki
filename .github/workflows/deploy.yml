name: Deploy Wiki.js

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USERNAME: ${{ secrets.SSH_USERNAME }}
          DEPLOY_KEY: ${{ secrets.SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "SSH_HOST fehlt in den Repository Secrets" >&2; exit 1; }
          test -n "$DEPLOY_USERNAME" || { echo "SSH_USERNAME fehlt in den Repository Secrets" >&2; exit 1; }
          test -n "$DEPLOY_KEY" || { echo "SSH_KEY fehlt in den Repository Secrets" >&2; exit 1; }

      - name: Deploy to Hetzner VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 15m
          script: |
            set -e
            cd /opt/swuniverse/wiki
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            chmod +x deploy-remote.sh
            ./deploy-remote.sh
